<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs Typewriter</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-inter h-screen flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl p-6 bg-gray-800 rounded-xl shadow-2xl border border-gray-700">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Google Docs Typewriter
            </h1>
            <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-700 text-gray-300">
                Idle
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Left Column: Controls -->
            <div class="col-span-1 space-y-4">
                
                <!-- URL Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Google Doc URL</label>
                    <input type="text" id="docKey" placeholder="Paste URL here..." 
                        class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 text-sm">
                </div>

                <!-- WPM Slider -->
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Typing Speed: <span id="wpmValue" class="text-blue-400">60</span> WPM</label>
                    <input type="range" id="wpmSlider" min="10" max="200" value="60" 
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- Toggles -->
                <div class="flex items-center justify-between p-3 bg-gray-900 rounded-lg border border-gray-700">
                    <span class="text-sm text-gray-400">Cleanup Source</span>
                    <input type="checkbox" id="cleanupToggle" class="w-4 h-4 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                </div>

                <!-- Action Buttons -->
                <div class="pt-4 space-y-3">
                    <button onclick="startTyping()" id="startBtn" 
                        class="w-full py-2 px-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 rounded-lg font-semibold transition-all shadow-lg transform active:scale-95">
                        Start Typing
                    </button>
                    
                    <button onclick="stopTyping()" id="stopBtn" 
                        class="w-full py-2 px-4 bg-red-600 hover:bg-red-700 rounded-lg font-semibold transition-all hidden">
                        Stop
                    </button>

                    <button onclick="login()" 
                        class="w-full py-2 px-4 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-all border border-gray-600">
                        Login to Google
                    </button>
                </div>

            </div>

            <!-- Right Column: Editor -->
            <div class="col-span-2 flex flex-col h-full">
                <label class="block text-sm font-medium text-gray-400 mb-1">Source Content</label>
                <textarea id="sourceText" placeholder="Paste your text here..." 
                    class="flex-1 w-full p-4 bg-gray-900 border border-gray-600 rounded-lg resize-none focus:outline-none focus:border-purple-500 font-mono text-sm leading-relaxed h-96"></textarea>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="mt-6">
            <div class="flex justify-between text-xs text-gray-400 mb-1">
                <span>Progress</span>
                <span id="progressText">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p id="statusMsg" class="text-xs text-center text-gray-500 mt-2 h-4"></p>
        </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg shadow-lg transform translate-y-20 transition-transform duration-300 text-sm">
        Notification
    </div>

    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="app.js"></script>
</body>
</html>
